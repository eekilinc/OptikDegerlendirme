name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - run: dotnet restore OptikFormApp.csproj
    - run: dotnet build OptikFormApp.csproj --no-restore -c Release
    - run: dotnet test OptikFormApp.Tests/OptikFormApp.Tests.csproj -c Release --collect:"XPlat Code Coverage"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: '**/coverage.cobertura.xml'